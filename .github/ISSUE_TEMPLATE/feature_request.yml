name: Feature request
description: Suggest an improvement that fits a lightweight editor
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please write the request in English first.
        You may add a Simplified Chinese translation in a collapsible `<details>` section.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What interaction do you expect?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
